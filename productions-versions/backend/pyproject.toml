[project]
name = "productions-versions-backend"
version = "0.1.0"
description = "Workflow service for production version and BOM validation."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httplib2>=0.22.0",
    "pydantic>=2.8.0",
    "pypdf>=5.0.0",
    "pysocks>=1.7.1",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
