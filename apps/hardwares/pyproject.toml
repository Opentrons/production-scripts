[project]
name = "productions-hardwares"
version = "1.5.9"
description = "Production hardware CLI, devices, drivers, diagnostics, and manufacturing tools."
requires-python = ">=3.10,<3.11"
dependencies = [
    "crcmod>=1.7",
    "inquirerpy>=0.3.4",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "paramiko>=3.4.0",
    "pyserial>=3.5",
    "requests>=2.28.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "typing-extensions>=4.0.0",
]

[project.scripts]
productions-hardwares = "cli.main:main"

[build-system]
requires = ["setuptools>=60.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["utils"]

[dependency-groups]
build = [
    "pyinstaller>=5.0.0",
    "setuptools>=60.0.0",
    "wheel>=0.37.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.18.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resources = [
    "**/*",
]
tools = [
    "get_ot3_version/*.md",
    "pipette_function_formating/*.txt",
]
leveling_testing = [
    "leveling_config.json",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
