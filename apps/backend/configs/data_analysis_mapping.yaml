products:
  Robot:
    tests:
      Diagnostic:
        unit_tracker:
          <<: *robot_source
          required_any_keys: [result, instrument_qc, pipette_96_qc, gantrys, signals, instruments, connectivity, peripherals]
        standard_line: *robot_line
      XY Belt Calibration:
        unit_tracker:
          <<: *robot_source
          required_any_keys: [xy_motion]
        standard_line: *robot_line
      Gantry Stress:
        unit_tracker:
          <<: *robot_source
          required_any_keys: [gantry_cycle]
        standard_line: *robot_line
      Leveling:
        unit_tracker:
          <<: *robot_source
          required_any_keys: [leveling_link, gantry_leveling, z_stage_parallelism, pipette_parallelism, gripper_parallelism]
        standard_line: *robot_line
      Z Stage:
        unit_tracker:
          <<: *robot_source
          required_any_keys: [z_stage_result, z_motion, z_stage_parallelism]
        standard_line: *robot_line
  P1KS:
    tests:
      Gravimetric:
        sheet_name: Gravimetric Raw Data
        cols: [A, B, C, D]
        analyzer: gravimetric
  P50S:
    tests:
      Gravimetric:
        sheet_name: Gravimetric Raw Data
        cols: [A, B, C, D]
        analyzer: gravimetric
        unit_tracker: *single_gravimetric_source
        standard_line: *single_gravimetric_line
      Assembly QC:
        sheet_name: RawData
        cols: [A, B, C, D, E, F]
        analyzer: pipette_assembly_qc
        unit_tracker:
          <<: *single_qc_source
          required_any_keys: [assembly_result, diagnostic_result]
        standard_line: *single_qc_line
      Speed Current:
        unit_tracker:
