unit_tracker_definitions:
  robot_source: &robot_source
    header_row: 2
    data_start_row: 3
    range_end: AK
    sn_key: sn
    link_key: link
    identity_keys: [sn, link]
  robot_line: &robot_line
    groups:
    - key: info
      label: Info
      columns:
      - {key: index, label: Index, source_column: A}
      - {key: sn, label: Flex SN, source_column: C}
      - {key: z_stage_sn, label: Z-Stage SN, source_column: D}
      - {key: result, label: Test Result, source_column: E}
      - {key: link, label: Link, source_column: J}
      - {key: cosmetic_panel, label: Cosmetic Panel, source_column: O}
      - {key: test_version_1, label: Test Version 1, source_column: Q}
      - {key: test_version_2, label: Test Version 2, source_column: R}
      - {key: test_version_3, label: Test Version 3, source_column: S}
    - key: checks
      label: Checks
      columns:
      - {key: factory_reset, label: Factory Reset, source_column: F}
      - {key: calibration_file, label: Calibration File, source_column: G}
      - {key: instrument_qc, label: 1/8ch/Gripper QC, source_column: H}
      - {key: pipette_96_qc, label: 96ch QC, source_column: I}
      - {key: z_stage_result, label: Z-Stage Result, source_column: K}
    - key: subsystems
      label: Subsystems
      columns:
      - {key: gantrys, label: Gantrys, source_column: T}
      - {key: signals, label: Signals, source_column: U}
      - {key: instruments, label: Instruments, source_column: V}
      - {key: connectivity, label: Connectivity, source_column: W}
      - {key: peripherals, label: Peripherals, source_column: X}
    - key: network
      label: Network
      columns:
      - {key: ethernet, label: Ethernet, source_column: Y}
      - {key: wifi, label: Wi-Fi, source_column: Z}
    - key: motion
      label: Motion
      columns:
      - {key: slot_distances, label: Slot Distances, source_column: AA}
      - {key: gantry_cycle, label: Gantry Cycle, source_column: AB}
      - {key: xy_motion, label: XY Motion, source_column: AC}
      - {key: z_motion, label: Z Motion, source_column: AD}
    - key: leveling
      label: Leveling
      columns:
      - {key: leveling_link, label: Leveling Link, source_column: AE}
      - {key: gantry_leveling, label: Gantry Leveling, source_column: AF}
      - {key: z_stage_parallelism, label: Z-Stage Parallelism, source_column: AG}
      - {key: pipette_parallelism, label: Pipette Parallelism, source_column: AH}
      - {key: gripper_parallelism, label: Gripper Parallelism, source_column: AI}
    - key: status
      label: Status
      columns:
      - {key: packaged, label: Packaged, source_column: B}
      - {key: stocked, label: Stocked, source_column: AK}

  single_gravimetric_source: &single_gravimetric_source
    header_row: 10
    data_start_row: 11
    range_end: AW
    sn_key: sn
    link_key: link
    identity_keys: [sn, link]
  single_gravimetric_line: &single_gravimetric_line
    groups:
    - key: info
      label: Info
      columns:
      - {key: index, label: Index, source_column: A}
      - {key: sn, label: SN, source_column: F}
      - {key: model, label: Model, source_column: G}
      - {key: result, label: Result, source_column: H}
      - {key: link, label: Link, source_column: E}
      - {key: test_version, label: Test Version, source_column: M}
      - {key: operator_name, label: Operator, source_column: AO}
      - {key: test_time, label: Test Time UTC, source_column: AM}
    - key: disposition
      label: Disposition
      columns:
      - {key: packaged, label: Packaged, source_column: B}
      - {key: retest, label: Retest, source_column: C}
      - {key: reasons, label: Reasons, source_column: I}
      - {key: warnings, label: Warnings, source_column: J}
      - {key: notes, label: Notes, source_column: D}
      - {key: stocked, label: Stocked, source_columns: [AW, AV]}
    - key: equipment
      label: Equipment
      columns:
      - {key: scale, label: Scale, source_column: K}
      - {key: robot, label: Robot, source_column: L}
      - {key: pipette_mount, label: Mount, source_column: AN}
    - key: minimum_volume
      label: Minimum Volume
      columns:
      - {key: min_cv, label: CV, source_column: N}
      - {key: min_deviation, label: '%D', source_column: O}
      - {key: min_water_remaining, label: Water Remaining, source_column: P}
      - {key: min_tips, label: Tips, source_column: Q}
      - {key: min_asp_range, label: Aspirate Range, source_column: R}
      - {key: min_disp_range, label: Dispense Range, source_column: S}
    - key: maximum_volume
      label: Maximum Volume
      columns:
      - {key: max_cv, label: CV, source_column: T}
      - {key: max_deviation, label: '%D', source_column: U}
      - {key: max_water_remaining, label: Water Remaining, source_column: V}
      - {key: max_tips, label: Tips, source_column: W}
      - {key: max_asp_range, label: Aspirate Range, source_column: X}
      - {key: max_disp_range, label: Dispense Range, source_column: Y}
    - key: environment
      label: Environment
      columns:
      - {key: stem_temperature, label: Stem Temp, source_column: Z}
      - {key: stem_humidity, label: Stem Humidity, source_column: AA}
      - {key: air_temperature, label: Air Temp, source_column: AB}
      - {key: air_humidity, label: Air Humidity, source_column: AC}
    - key: middle_volume
      label: Middle Volume
      columns:
      - {key: mid1_cv, label: Mid1 CV, source_column: AD}
      - {key: mid1_deviation, label: Mid1 %D, source_column: AE}
      - {key: mid1_water_remaining, label: Mid1 Water Remaining, source_column: AF}
      - {key: mid1_tips, label: Mid1 Tips, source_column: AG}
      - {key: mid2_cv, label: Mid2 CV, source_column: AH}
      - {key: mid2_deviation, label: Mid2 %D, source_column: AI}
      - {key: mid2_water_remaining, label: Mid2 Water Remaining, source_column: AJ}
      - {key: mid2_tips, label: Mid2 Tips, source_column: AK}
    - key: tip_batch
      label: Tip Batch
      columns:
      - {key: starting_weight, label: Starting Weight, source_column: AL}
      - {key: tip_batch, label: Tip Batch, source_column: AS}
      - {key: tip_cavity, label: Tip Cavity, source_column: AT}

  multi_gravimetric_source: &multi_gravimetric_source
