[project]
name = "production-backend"
version = "1.0.0"
description = "Unified production data, robot, version, SOP, and workflow API."
requires-python = ">=3.10"
dependencies = [
    "aiofiles",
    "aiohttp",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "httplib2>=0.22.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "pandas",
    "paramiko",
    "playwright>=1.50.0",
    "pwdlib[argon2]>=0.2.1",
    "pydantic>=2.8.0",
    "pyjwt[crypto]>=2.10.0",
    "pymongo",
    "pypdf>=5.0.0",
    "pysocks>=1.7.1",
    "python-multipart",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "slack-sdk",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modules.robots.api_client" = ["opentrons_openapi.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
